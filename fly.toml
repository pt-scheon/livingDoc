# Fly.io: fly launch --no-deploy --copy-config && fly volumes create livingdoc_data --size 1 && fly secrets set LIVINGDOC_ADMIN_PASSWORD=... && fly deploy
app = "livingdoc-CHANGE-ME"
primary_region = "bom"

[build]

[env]
  PORT = "8000"

[mounts]
  source = "livingdoc_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.checks]
    [http_service.checks.health]
      grace_period = "20s"
      interval = "30s"
      method = "GET"
      path = "/api/health"
      timeout = "5s"
